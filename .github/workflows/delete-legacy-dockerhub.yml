# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Delete legacy Docker Hub repository

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter safrano9999/openclaw-ephemeral-testing exactly
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete-exact-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the confirmed legacy repository
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          namespace='safrano9999'
          repository='openclaw-ephemeral-testing'
          expected="${namespace}/${repository}"
          endpoint="https://hub.docker.com/v2/repositories/${namespace}/${repository}/"

          test "$CONFIRMATION" = "$expected"
          test "$DOCKERHUB_USERNAME" = "$namespace"
          : "${DOCKERHUB_TOKEN:?Missing DOCKERHUB_TOKEN}"

          payload="$(
            jq -nc \
              --arg username "$DOCKERHUB_USERNAME" \
              --arg password "$DOCKERHUB_TOKEN" \
              '{username: $username, password: $password}'
          )"
          jwt="$(
            curl -fsSL \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              https://hub.docker.com/v2/users/login/ \
              | jq -er .token
          )"

          current="$(curl -fsSL -H "Authorization: JWT $jwt" "$endpoint")"
          test "$(jq -r .namespace <<<"$current")" = "$namespace"
          test "$(jq -r .name <<<"$current")" = "$repository"

          delete_status="$(
            curl -sS \
              -o /tmp/dockerhub-delete-response \
              -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: JWT $jwt" \
              "$endpoint"
          )"
          case "$delete_status" in
            202|204) ;;
            *)
              cat /tmp/dockerhub-delete-response >&2
              printf 'Unexpected Docker Hub delete status: %s\n' "$delete_status" >&2
              exit 1
              ;;
          esac

          remaining_status="$(curl -sS -o /dev/null -w '%{http_code}' "$endpoint")"
          test "$remaining_status" = 404
          printf 'Deleted Docker Hub repository: %s\n' "$expected"
